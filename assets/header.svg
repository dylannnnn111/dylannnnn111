<svg viewBox="0 0 900 240" width="900" height="240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Dylan Lewis - I build AI agents and run them in production" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1726"/><stop offset="1" stop-color="#13213a"/></linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#ffffff" opacity=".06"/></pattern>
    <clipPath id="typeclip"><rect class="tc" x="40" y="148" height="30" width="560"/></clipPath>
  </defs>
  <style>
    .h{font:600 46px Georgia,'Times New Roman',serif;fill:#f4f1ea}
    .s{font:16px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#9fb0cc}
    .p{font:15px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#f4f1ea}
    .f{font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#9fb0cc}
    .k{fill:#e0533f}
    .tc{animation:t 7s steps(46) infinite}
    @keyframes t{0%{width:0}45%,100%{width:560px}}
    .cur{animation:b 1s steps(1) infinite}
    @keyframes b{50%{opacity:0}}
    .ln{stroke-dasharray:900;stroke-dashoffset:900;animation:d 7s ease-out infinite}
    .ln2{animation-delay:.5s}
    @keyframes d{0%{stroke-dashoffset:900}45%,100%{stroke-dashoffset:0}}
    .ag{animation:m 7s ease-in-out infinite}
    .ag2{animation-delay:-3.5s}
    @keyframes m{0%,100%{transform:translate(0,0)}25%{transform:translate(0,26px)}50%{transform:translate(0,52px)}75%{transform:translate(0,26px)}}
    @media (prefers-reduced-motion: reduce){.tc,.cur,.ln,.ag{animation:none}.ln{stroke-dashoffset:0}}
  </style>
  <rect width="900" height="240" rx="10" fill="url(#bg)"/>
  <rect width="900" height="240" rx="10" fill="url(#dots)"/>
  <text x="40" y="78" class="s">dylanlewis.au · Sydney</text>
  <text x="40" y="128" class="h">Dylan Lewis<tspan class="k">.</tspan></text>
  <g clip-path="url(#typeclip)"><text x="40" y="168" class="p"><tspan class="k">$</tspan> build agents --that do-real-work --then run-them</text></g>
  <rect x="40" y="184" width="9" height="2" class="k cur"/>
  <g transform="translate(640,52)">
    <rect width="220" height="150" rx="10" fill="#0a1220" stroke="#24324c"/>
    <text x="34" y="30" class="f">agent.ts</text><text x="34" y="56" class="f">tools.ts</text><text x="34" y="82" class="f">eval.ts</text><text x="34" y="108" class="f">judge.ts</text><text x="34" y="134" class="f">results.json</text>
    <g class="ag"><rect x="8" y="18" width="204" height="18" rx="4" fill="#e0533f" opacity=".16"/><circle cx="20" cy="27" r="4" fill="#e0533f"/></g>
    <g class="ag ag2"><rect x="8" y="18" width="204" height="18" rx="4" fill="#6f8cd6" opacity=".16"/><circle cx="20" cy="27" r="4" fill="#6f8cd6"/></g>
  </g>
  <polyline class="ln" fill="none" stroke="#6f8cd6" stroke-width="2" points="380,214 420,206 460,210 500,198 540,202 580,190 620,194"/>
  <polyline class="ln ln2" fill="none" stroke="#e0533f" stroke-width="2" points="380,222 420,220 460,214 500,216 540,208 580,210 620,204"/>
</svg>
